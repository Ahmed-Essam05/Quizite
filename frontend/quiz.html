<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Take this quiz on Quizite and test your knowledge."
    />
    <title>Quizite — Take quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/overview.css" />
    <link rel="stylesheet" href="/quiz.css" />
    <link rel="stylesheet" href="/design-system.css" />
    <link rel="stylesheet" href="/likes.css" />
    <script src="/quizResultStore.js" defer></script>
    <script src="/quiz.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to quiz content</a>

    <!-- Topbar -->
    <header class="topbar quiz-topbar">
      <div class="quiz-topbar__left">
        <a class="brand" href="/" aria-label="Quizite home">
          <span class="brand-mark" aria-hidden="true">Q</span>
          <span class="brand-title">Quizite</span>
        </a>
      </div>

      <div class="topbar-actions">
        <button
          class="theme-toggle"
          type="button"
          data-theme-toggle
          aria-label="Switch color theme"
          title="Switch theme"
        >
          <span class="theme-toggle__sun" aria-hidden="true">☀</span>
          <span class="theme-toggle__moon" aria-hidden="true">☾</span>
        </button>

        <div class="quiz-like-control">
          <button
            class="btn btn-subtle like-button"
            type="button"
            id="like-btn"
            aria-label="Like this quiz"
            aria-pressed="false"
            title="Like this quiz"
            hidden
          >
            <span class="like-button__icon" aria-hidden="true">♥</span>
          </button>
          <span class="like-count" id="like-count">0</span>
          <button
            class="like-count like-count-button"
            type="button"
            id="like-count-btn"
            aria-label="View who liked this quiz"
            aria-haspopup="dialog"
            title="View who liked this quiz"
            hidden
          >
            <span id="like-count-button-value">0</span>
          </button>
        </div>

        <button class="btn btn-subtle" type="button" id="share-quiz-btn">
          <svg
            viewBox="0 0 16 16"
            width="14"
            height="14"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z"
            ></path>
          </svg>
          <span>Share link</span>
        </button>

        <a class="btn" href="/">Overview</a>
      </div>
    </header>

    <main id="main-content" class="quiz-main" tabindex="-1">
      <!-- Loading State -->
      <div id="quiz-loading" class="quiz-loading">
        <span class="quiz-spinner" aria-hidden="true"></span>
        <p>Loading quiz…</p>
      </div>

      <!-- Error State -->
      <div id="quiz-error" class="quiz-error-card" hidden>
        <h2>Quiz Unavailable</h2>
        <p id="quiz-error-msg">The requested quiz could not be loaded.</p>
        <a class="btn btn--primary" href="/">Go to overview</a>
      </div>

      <!-- Quiz Content Area -->
      <div id="quiz-container" class="quiz-container" hidden>
        <!-- Quiz Header Card -->
        <header class="quiz-header-card">
          <div class="quiz-header-card__top">
            <div class="quiz-hero-title-row">
              <span
                id="quiz-icon"
                class="quiz-hero-icon"
                aria-hidden="true"
                hidden
              ></span>
              <h1 id="quiz-title" class="quiz-hero-title"></h1>
            </div>
            <span id="quiz-status-pill" class="quiz-pill"></span>
          </div>

          <p id="quiz-desc" class="quiz-hero-desc"></p>

          <div class="quiz-meta-row">
            <span class="meta-tag">
              <span class="meta-dot" aria-hidden="true"></span>
              <span id="quiz-q-count"></span>
            </span>
            <span class="meta-tag" id="quiz-author-wrap">
              Created by <strong id="quiz-author"></strong>
            </span>
            <span class="meta-tag" id="quiz-took-wrap">
              <strong id="quiz-took-count">0</strong>
              <span id="quiz-took-noun">people</span> tried this
            </span>
          </div>
        </header>

        <!-- Status Note (already completed / retakes disabled) -->
        <div id="quiz-status-note" class="quiz-status-note" hidden></div>

        <!-- Quiz Questions Form -->
        <form id="quiz-take-form" class="quiz-questions-form" novalidate>
          <div id="questions-render-area" class="questions-render-area"></div>

          <nav
            id="quiz-page-nav"
            class="quiz-page-nav"
            aria-label="Quiz page navigation"
            hidden
          >
            <button class="btn" type="button" id="prev-page-btn">
              ← Previous
            </button>
            <span
              id="quiz-page-indicator"
              class="quiz-page-indicator"
              aria-live="polite"
            ></span>
            <button class="btn" type="button" id="next-page-btn">
              Next →
            </button>
          </nav>

          <div class="quiz-form-footer">
            <button
              class="btn btn--primary btn-large"
              type="submit"
              id="submit-quiz-btn"
            >
              Submit Answers
            </button>
          </div>
        </form>
      </div>
    </main>

    <!-- Unanswered Questions Confirmation Modal -->
    <div id="unanswered-modal" class="delete-modal-backdrop" hidden>
      <div
        class="delete-modal unanswered-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="unanswered-modal-title"
        aria-describedby="unanswered-modal-message"
        tabindex="-1"
      >
        <div
          class="delete-modal__icon unanswered-modal__icon"
          aria-hidden="true"
        >
          <svg
            viewBox="0 0 24 24"
            width="30"
            height="30"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path>
            <path d="M12 9v4"></path>
            <path d="M12 17h.01"></path>
          </svg>
        </div>
        <h2 id="unanswered-modal-title" class="delete-modal__title">
          You have unanswered questions
        </h2>
        <p id="unanswered-modal-message" class="delete-modal__description"></p>
        <div class="delete-modal__actions">
          <button
            class="btn btn--primary"
            type="button"
            id="review-unanswered-btn"
          >
            Review unanswered questions
          </button>
          <button class="btn" type="button" id="submit-anyway-btn">
            Submit anyway
          </button>
        </div>
      </div>
    </div>

    <!-- Quiz Likes Modal (owner only) -->
    <div id="quiz-likes-modal" class="delete-modal-backdrop" hidden>
      <div
        class="delete-modal likes-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="quiz-likes-modal-title"
        aria-describedby="quiz-likes-modal-description"
        tabindex="-1"
      >
        <div class="delete-modal__icon likes-modal__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z"></path>
          </svg>
        </div>
        <h2 id="quiz-likes-modal-title" class="delete-modal__title">
          Liked by
        </h2>
        <p id="quiz-likes-modal-description" class="delete-modal__description">
          People who liked &ldquo;<strong
            id="quiz-likes-modal-quiz-title"
          ></strong
          >&rdquo;.
        </p>

        <div
          id="quiz-likes-modal-status"
          class="likes-modal__status"
          role="status"
          aria-live="polite"
        ></div>
        <p
          id="quiz-likes-modal-error"
          class="delete-modal__error"
          role="alert"
          hidden
        ></p>
        <ul
          id="quiz-likes-list"
          class="likes-list"
          aria-label="People who liked this quiz"
        ></ul>
        <button
          class="btn likes-modal__retry"
          type="button"
          id="quiz-likes-modal-retry"
          hidden
        >
          Try again
        </button>

        <div class="delete-modal__actions">
          <button class="btn" type="button" id="quiz-likes-modal-close">
            Close
          </button>
        </div>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
